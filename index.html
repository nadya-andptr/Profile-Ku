<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Portofolio</title>
  <!-- Bootstrap CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-yEPZ7jP9S0QKiUQ0m3jjsO4ProIW7wvR9gXkI7JOGa2XVsw53Yke2bsdkBbjmmiX" crossorigin="anonymous">


  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500&family=Nunito+Sans:wght@400;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Salju yang jatuh pelan -->
  <div class="snow" id="snow" aria-hidden="true"></div>

  <!-- Bunga yang melayang pelan -->
  <div class="flowers" id="flowers" aria-hidden="true"></div>

  <!-- Cursor bunga -->
  <div class="cursor-trail" id="cursorTrail" aria-hidden="true"></div>

  <!-- Navbar -->
  
<header class="navbar d-flex justify-content-between align-items-center">
  <a href="#top" class="logo">
    <span class="logo-flower" aria-hidden="true"></span>
    <span id="navName"></span>
  </a>
  <nav class="d-flex flex-wrap gap-3">
    <a href="#about">Tentang</a>
    <a href="#skills">Keahlian</a>
    <a href="#gallery">Galeri</a>
    <a href="#contact">Kontak</a>
  </nav>
</header>


  <main>
    <!-- Hero -->
    <section class="hero d-flex flex-column align-items-center justify-content-center text-center" id="top">
       <div class="avatar" id="avatarBox"></div>
       <p class="sapaan">Selamat datang di portofolio</p>
       <h1 id="heroName"></h1>
       <p class="tagline" id="heroTitle"></p>
       <p class="quote" id="heroQuote"></p>
       <a href="#gallery" class="btn btn-lihat rounded-pill">Lihat Karya</a>
    </section>


    <!-- Tentang -->
     <section class="section container" id="about">
      <div class="glass w-100">
        <h2><span class="h-flower" aria-hidden="true"></span>Tentang Penulis</h2>
        <div class="about-body" id="bioBody"></div>
      </div>
    </section>


    <!-- Keahlian -->
     <section class="section container" id="skills">
      <div class="glass w-100">
        <h2><span class="h-flower" aria-hidden="true"></span>Keahlian</h2>
        <ul class="tags list-unstyled d-flex flex-wrap gap-2 p-0" id="skillTags"></ul>
        <h3 class="sub">Alat yang aku pakai</h3>
        <div id="toolList" class="d-flex flex-column"></div>
      </div>
    </section>


    <!-- Galeri -->
     <section class="section wide container" id="gallery">
      <h2><span class="h-flower" aria-hidden="true"></span>Galeri</h2>
      <div class="row g-3 g-md-4" id="galleryGrid"></div>
    </section>


    <!-- Kontak -->
     <section class="section container" id="contact">
      <div class="glass w-100">
        <h2><span class="h-flower" aria-hidden="true"></span>Kontak</h2>
        <p>Mau kepoin atau sekedar menyapa aku? Check di sini ya!</p>
        <div class="contact d-flex flex-wrap gap-3" id="contactList"></div>
      </div>
    </section>
  </main>

  <!-- Footer -->
   <footer class="d-flex align-items-center justify-content-center gap-2">
    <span class="logo-flower small" aria-hidden="true"></span>
    <span id="footName"></span>
  </footer>

  <!-- Tampilan gambar besar (bisa di-zoom) -->
  <div class="lb" id="lb" role="dialog" aria-label="Lihat gambar">
    <button class="lb-close" id="lbClose" aria-label="Tutup">✕</button>

    <div class="stage" id="lbStage">
      <div class="big" id="lbImg"></div>
    </div>

    <div class="lb-bar">
      <button id="zOut" aria-label="Perkecil">−</button>
      <button id="zReset" aria-label="Kembalikan ukuran">100%</button>
      <button id="zIn" aria-label="Perbesar">+</button>
    </div>

    <div id="lbCap"></div>
    <small>Scroll atau cubit untuk memperbesar · klik di luar gambar untuk menutup</small>
  </div>
  
  <!-- Bootstrap JavaScript -->
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.9/dist/js/bootstrap.bundle.min.js" integrity="sha384-WyOxWvTyr1QaMPfiPJSv76iReVthorl5uWlFtZPyK0IEB0hGzo9y5Bp9mYanr8Bu" crossorigin="anonymous"></script>
   <!-- Script milik website -->
    <script src="data.js"></script>
    <script src="script.js"></script>

</body>
</html>
